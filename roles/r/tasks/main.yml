---
- name: Set variables
  ansible.builtin.set_fact:
    r_path: "{{ ansible_facts['env']['PATH'] }}:/usr/local/bin"
    r_libs: "{{ ansible_facts['env']['HOME'] }}/.clir/r/%v/library"
    r_clir: "{{ ansible_facts['env']['HOME'] }}/.clir/bin/clir"

- name: Set R_LIBS_USER and add clir bin directory to PATH in zprofile
  ansible.builtin.blockinfile:
    create: true
    dest: "{{ ansible_facts['env']['HOME'] }}/.zprofile"
    marker: "# {mark} ANSIBLE MANAGED BLOCK: R library"
    mode: "0644"
    state: present
    block: |
      export R_LIBS_USER="{{ r_libs }}"
      export PATH="{{ ansible_facts['env']['HOME'] }}/.clir/bin:${PATH}"
  notify: Notify updates of R via Slack

- name: Create a temporary file for the clir installer
  ansible.builtin.tempfile:
    state: file
    suffix: .sh
  register: r_clir_installer

- name: Download the installer of clir
  ansible.builtin.get_url:
    url: https://raw.githubusercontent.com/dceoy/clir/67579209ec0fd338445b70010addc8aa7309ede4/install_clir.sh
    dest: "{{ r_clir_installer.path }}"
    mode: "0755"

- name: Install or update clir
  environment:
    PATH: "{{ r_path }}"
    R_LIBS_USER: "{{ r_libs }}"
  ansible.builtin.command:
    argv:
      - bash
      - "{{ r_clir_installer.path }}"
  changed_when: true
  notify: Notify updates of R via Slack

- name: Remove the installer
  ansible.builtin.file:
    path: "{{ r_clir_installer.path }}"
    state: absent

- name: Set cran repositories
  when:
    - r_repos is defined
    - r_repos.cran is defined
  environment:
    PATH: "{{ r_path }}"
    R_LIBS_USER: "{{ r_libs }}"
  ansible.builtin.command:
    argv:
      - "{{ r_clir }}"
      - cran
      - "{{ item }}"
  loop: "{{ r_repos.cran }}"
  changed_when: true
  notify: Notify updates of R via Slack

- name: Install and update cran packages
  when:
    - r_repos is defined
    - r_repos.cran is defined
    - r_packages is defined
    - r_packages.cran is defined
  environment:
    PATH: "{{ r_path }}"
    R_LIBS_USER: "{{ r_libs }}"
  ansible.builtin.command:
    argv:
      - "{{ r_clir }}"
      - install
      - --quiet
      - "{{ item }}"
  loop: "{{ r_packages.cran }}"
  changed_when: true
  failed_when: false
  notify: Notify updates of R via Slack

- name: Install and update bioconductor packages
  when:
    - r_packages is defined
    - r_packages.bioconductor is defined
  environment:
    PATH: "{{ r_path }}"
    R_LIBS_USER: "{{ r_libs }}"
  ansible.builtin.command:
    argv:
      - "{{ r_clir }}"
      - install
      - --quiet
      - "bioc::{{ item }}"
  loop: "{{ r_packages.bioconductor }}"
  changed_when: true
  failed_when: false
  notify: Notify updates of R via Slack
