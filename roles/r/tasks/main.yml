---
- name: Set variables
  ansible.builtin.set_fact:
    path: "{{ ansible_facts['env']['PATH'] }}:/usr/local/bin"
    r_libs: "{{ ansible_facts['env']['HOME'] }}/.clir/r/library"
    clir: "{{ ansible_facts['env']['HOME'] }}/.clir/bin/clir"
    install_clir_sh: /tmp/install_clir.sh

- name: Download the installer of clir
  ansible.builtin.get_url:
    url: https://raw.githubusercontent.com/dceoy/clir/bf6c2cf7fbdea0b026e7ad4a0262e33bbf87ca01/install_clir.sh
    dest: "{{ install_clir_sh }}"
    mode: "0755"

- name: Install or update clir
  environment:
    PATH: "{{ path }}"
    R_LIBS_USER: "{{ r_libs }}"
  ansible.builtin.command:
    argv:
      - bash
      - "{{ install_clir_sh }}"
  changed_when: true
  notify: Notify updates of R via Slack

- name: Remove the installer
  ansible.builtin.file:
    path: "{{ install_clir_sh }}"
    state: absent

- name: Set cran repositories
  when:
    - r_repos is defined
    - r_repos.cran is defined
  environment:
    PATH: "{{ path }}"
    R_LIBS_USER: "{{ r_libs }}"
  ansible.builtin.command:
    argv:
      - "{{ clir }}"
      - cran
      - "{{ item }}"
  loop: "{{ r_repos.cran }}"
  changed_when: true
  notify: Notify updates of R via Slack

- name: Install and update cran packages
  when:
    - r_repos is defined
    - r_repos.cran is defined
    - r_packages is defined
    - r_packages.cran is defined
  environment:
    PATH: "{{ path }}"
    R_LIBS_USER: "{{ r_libs }}"
  ansible.builtin.command:
    argv:
      - "{{ clir }}"
      - install
      - --devt=cran
      - --quiet
      - "{{ item }}"
  loop: "{{ r_packages.cran }}"
  changed_when: true
  failed_when: false
  notify: Notify updates of R via Slack

- name: Install and update bioconductor packages
  when:
    - r_packages is defined
    - r_packages.bioconductor is defined
  environment:
    PATH: "{{ path }}"
    R_LIBS_USER: "{{ r_libs }}"
  ansible.builtin.command:
    argv:
      - "{{ clir }}"
      - install
      - --devt=bioc
      - --quiet
      - "{{ item }}"
  loop: "{{ r_packages.bioconductor }}"
  changed_when: true
  failed_when: false
  notify: Notify updates of R via Slack
