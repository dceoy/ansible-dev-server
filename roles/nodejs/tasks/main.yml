---
- name: Set variables
  ansible.builtin.set_fact:
    nodejs_path: "{{ ansible_facts['env']['PATH'] }}:/usr/local/bin"

- name: Install and update Node.js command-line tools
  when: nodejs_cli_tools is defined
  environment:
    PATH: "{{ nodejs_path }}"
  community.general.npm:
    name: "{{ item }}"
    global: true
    state: latest  # noqa: package-latest
  loop: >-
    {{
      nodejs_cli_tools
      + (nodejs_cli_tools_non_macos | default([])
         if ansible_facts['distribution'] != 'MacOSX' else [])
      + (nodejs_cli_tools_ubuntu_apt | default([])
         if ansible_facts['distribution'] != 'MacOSX'
         and (ansible_facts['distribution'] != 'Ubuntu'
           or ansible_facts['distribution_version'] is version('26.04', '<')) else [])
    }}
    | reject('in', system_managed_nodejs_tools | default([])) | list
  failed_when: false
  notify: Notify updates of Node.js via Slack
