---
- name: Set variables
  ansible.builtin.set_fact:
    path: "{{ ansible_facts['env']['PATH'] }}:/usr/local/bin"

- name: Install and update packages
  when: npm_packages is defined
  environment:
    PATH: "{{ path }}"
  community.general.npm:
    name: "{{ item }}"
    global: true
    state: latest
  loop: "{{ npm_packages }}"
  failed_when: false
  notify: Notify updates of Node.js via Slack
