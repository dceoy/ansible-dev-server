---
- name: Set variables
  ansible.builtin.set_fact:
    nodejs_path: "{{ ansible_facts['env']['PATH'] }}:/usr/local/bin"

- name: Check standalone pnpm installation
  when: ansible_facts['distribution'] in ['Ubuntu', 'CentOS']
  ansible.builtin.stat:
    path: "{{ ansible_facts['env']['HOME'] }}/.local/share/pnpm/bin/pnpm"
  register: nodejs_pnpm_installed

- name: Download official pnpm installer
  when:
    - ansible_facts['distribution'] in ['Ubuntu', 'CentOS']
    - not nodejs_pnpm_installed.stat.exists
  ansible.builtin.get_url:
    url: https://get.pnpm.io/install.sh
    dest: /tmp/install.pnpm.sh
    mode: "0755"

- name: Install standalone pnpm
  when:
    - ansible_facts['distribution'] in ['Ubuntu', 'CentOS']
    - not nodejs_pnpm_installed.stat.exists
  ansible.builtin.command: /tmp/install.pnpm.sh
  environment:
    PNPM_HOME: "{{ ansible_facts['env']['HOME'] }}/.local/share/pnpm"
    SHELL: /bin/zsh
  changed_when: true
  notify: Notify updates of Node.js via Slack

- name: Update standalone pnpm
  when: ansible_facts['distribution'] in ['Ubuntu', 'CentOS']
  ansible.builtin.command:
    argv:
      - "{{ ansible_facts['env']['HOME'] }}/.local/share/pnpm/bin/pnpm"
      - self-update
  register: nodejs_pnpm_self_update
  changed_when: "'already up to date' not in (nodejs_pnpm_self_update.stdout ~ nodejs_pnpm_self_update.stderr) | lower"
  notify: Notify updates of Node.js via Slack

- name: Add standalone pnpm to PATH
  when: ansible_facts['distribution'] in ['Ubuntu', 'CentOS']
  ansible.builtin.blockinfile:
    create: true
    dest: "{{ ansible_facts['env']['HOME'] }}/.zprofile"
    marker: "# {mark} ANSIBLE MANAGED BLOCK: pnpm"
    mode: "0644"
    state: present
    block: |
      export PNPM_HOME="${HOME}/.local/share/pnpm"
      export PATH="${PNPM_HOME}/bin:${PATH}"
  notify: Notify updates of Node.js via Slack

- name: Install and update Node.js command-line tools
  when: nodejs_cli_tools_by_os is defined
  environment:
    PATH: "{{ nodejs_path }}"
  community.general.npm:
    name: "{{ item }}"
    global: true
    state: latest  # noqa: package-latest
  loop: "{{ nodejs_cli_tools_by_os[ansible_facts['distribution']] }}"
  failed_when: false
  notify: Notify updates of Node.js via Slack
