---
- name: Set proxy at /etc/environment
  when: http_proxy is defined or https_proxy is defined
  become: true
  ansible.builtin.blockinfile:
    create: true
    dest: /etc/environment
    mode: "0644"
    state: present
    block: |
      HTTP_PROXY={{ http_proxy | default('') }}
      HTTPS_PROXY={{ https_proxy | default('') }}
      NO_PROXY={{ no_proxy | default('') }}
      http_proxy={{ http_proxy | default('') }}
      https_proxy={{ https_proxy | default('') }}
      no_proxy={{ no_proxy | default('') }}
  notify: Notify updates of the system via Slack

- name: Set proxy at /etc/apt/apt.conf
  when: http_proxy is defined or https_proxy is defined
  become: true
  ansible.builtin.blockinfile:
    create: true
    dest: /etc/apt/apt.conf
    mode: "0644"
    state: present
    block: |
      Acquire::http::proxy "{{ http_proxy | default('') }}";
      Acquire::https::proxy "{{ https_proxy | default('') }}";
  notify: Notify updates of the system via Slack

- name: Write %sudo in /etc/sudoers.d/ansible-nopasswd
  when:
    - enable_nopass_sudo is defined
    - enable_nopass_sudo
  become: true
  ansible.builtin.blockinfile:
    create: true
    dest: /etc/sudoers.d/ansible-nopasswd
    mode: "0440"
    state: present
    block: |
      %sudo ALL=(ALL:ALL) NOPASSWD: ALL
    validate: 'visudo -cf %s'
  notify: Notify updates of the system via Slack

- name: Install required packages
  become: true
  ansible.builtin.apt:
    autoclean: true
    autoremove: true
    update_cache: true
    name:
      - aptitude
      - ca-certificates
      - python3-venv
    state: latest  # noqa: package-latest
  notify: Notify updates of the system via Slack

- name: Upgrade all packages
  become: true
  ansible.builtin.apt:
    autoclean: true
    autoremove: true
    upgrade: dist
    update_cache: true
  notify: Notify updates of the system via Slack

- name: Install packages
  when: ubuntu_apt_packages is defined
  become: true
  ansible.builtin.apt:
    autoclean: true
    autoremove: true
    name: "{{ item }}"
    state: latest  # noqa: package-latest
  loop: "{{ ubuntu_apt_packages }}"
  failed_when: false
  notify: Notify updates of the system via Slack

- name: Set users
  when: ubuntu_users is defined
  become: true
  ansible.builtin.user:
    name: "{{ item.name }}"
    shell: "{{ item.shell }}"
    groups: "{{ item.groups }}"
    append: true
  loop: "{{ ubuntu_users }}"
  notify: Notify updates of the system via Slack
