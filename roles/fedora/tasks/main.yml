---
- name: Set proxy at /etc/environment
  when: http_proxy is defined or https_proxy is defined
  become: true
  ansible.builtin.blockinfile:
    dest: /etc/environment
    state: present
    block: |
      HTTP_PROXY={{ http_proxy | default('') }}
      HTTPS_PROXY={{ https_proxy | default('') }}
      NO_PROXY={{ no_proxy | default('') }}
      http_proxy={{ http_proxy | default('') }}
      https_proxy={{ https_proxy | default('') }}
      no_proxy={{ no_proxy | default('') }}
  notify: Notify updates of the system via Slack

- name: Set proxy at /etc/dnf/dnf.conf
  when: http_proxy is defined or https_proxy is defined
  become: true
  ansible.builtin.blockinfile:
    dest: /etc/dnf/dnf.conf
    state: present
    block: |
      proxy={{ http_proxy | default(https_proxy) }}
  notify: Notify updates of the system via Slack

- name: Write %wheel in /etc/sudoers
  when:
    - enable_nopass_sudo is defined
    - enable_nopass_sudo
  become: true
  ansible.builtin.blockinfile:
    dest: /etc/sudoers
    state: present
    block: |
      %wheel  ALL=(ALL)       NOPASSWD: ALL
    validate: 'visudo -cf %s'
  notify: Notify updates of the system via Slack

- name: Upgrade all packages
  become: true
  ansible.builtin.dnf:
    name: '*'
    state: latest  # noqa: package-latest
    update_cache: true
  notify: Notify updates of the system via Slack

- name: Install packages
  when: fedora_dnf_packages is defined
  become: true
  ansible.builtin.dnf:
    name: "{{ fedora_dnf_packages }}"
    state: latest  # noqa: package-latest
    update_cache: true
  notify: Notify updates of the system via Slack


- name: Check available Fedora CLI packages
  ansible.builtin.command:
    argv:
      - dnf
      - -q
      - info
      - "{{ item.package }}"
  loop: "{{ fedora_system_cli_packages }}"
  register: fedora_cli_package_availability
  changed_when: false
  failed_when: false

- name: Install available system CLI packages
  become: true
  ansible.builtin.dnf:
    name: "{{ item.item.package }}"
    state: latest  # noqa: package-latest
  loop: "{{ fedora_cli_package_availability.results | selectattr('rc', 'equalto', 0) | list }}"
  failed_when: false  # Fallback to language managers if the RPM cannot be installed
  notify: Notify updates of the system via Slack

- name: Gather installed RPM package facts
  ansible.builtin.package_facts:
    manager: rpm

- name: Prefer installed RPM tools over language-managed duplicates
  ansible.builtin.set_fact:
    fedora_system_managed_nodejs_tools: >-
      {{
        fedora_system_cli_packages
        | selectattr('package', 'in', ansible_facts['packages'].keys())
        | selectattr('manager', 'equalto', 'nodejs')
        | map(attribute='tool') | list
      }}
    fedora_system_managed_go_tools: >-
      {{
        fedora_system_cli_packages
        | selectattr('package', 'in', ansible_facts['packages'].keys())
        | selectattr('manager', 'equalto', 'go')
        | map(attribute='tool') | list
      }}
    fedora_system_managed_python_tools: >-
      {{
        fedora_system_cli_packages
        | selectattr('package', 'in', ansible_facts['packages'].keys())
        | selectattr('manager', 'equalto', 'python')
        | map(attribute='tool') | list
      }}

- name: Set users
  when: fedora_users is defined
  become: true
  ansible.builtin.user:
    name: "{{ item.name }}"
    shell: "{{ item.shell }}"
    groups: "{{ item.groups }}"
    append: true
  loop: "{{ fedora_users }}"
  notify: Notify updates of the system via Slack
