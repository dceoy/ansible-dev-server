---
- name: Find Homebrew prefix for Python tools
  when:
    - python_uv_tools_by_os is defined
    - ansible_facts['distribution'] == 'MacOSX'
  ansible.builtin.command: brew --prefix
  register: python_homebrew_prefix
  changed_when: false

- name: Check system-managed uv on Fedora and CentOS
  when: ansible_facts['distribution'] in ['Fedora', 'CentOS']
  ansible.builtin.stat:
    path: /usr/bin/uv
  register: python_system_uv

- name: Select uv executable and tool packages
  when: python_uv_tools_by_os is defined
  ansible.builtin.set_fact:
    python_uv_standalone: "{{ ansible_facts['distribution'] != 'MacOSX' and not (python_system_uv.stat.exists | default(false)) }}"
    python_uv_executable: "{{ python_homebrew_prefix.stdout ~ '/bin/uv' if ansible_facts['distribution'] == 'MacOSX' else '/usr/bin/uv' if (python_system_uv.stat.exists | default(false)) else ansible_facts['env']['HOME'] ~ '/.local/bin/uv' }}"
    python_uv_selected_tools: "{{ python_uv_tools_by_os[ansible_facts['distribution']] }}"

- name: Check standalone uv installation
  when: python_uv_standalone
  ansible.builtin.stat:
    path: "{{ python_uv_executable }}"
  register: python_uv_installed

- name: Download official uv installer
  when:
    - python_uv_standalone
    - not python_uv_installed.stat.exists
  ansible.builtin.get_url:
    url: https://astral.sh/uv/install.sh
    dest: /tmp/install.uv.sh
    mode: "0755"

- name: Install standalone uv
  when:
    - python_uv_standalone
    - not python_uv_installed.stat.exists
  ansible.builtin.command: /tmp/install.uv.sh
  environment:
    UV_INSTALL_DIR: "{{ ansible_facts['env']['HOME'] }}/.local/bin"
    UV_NO_MODIFY_PATH: "1"
  changed_when: true
  notify: Notify updates of Python via Slack

- name: Update standalone uv
  when: python_uv_standalone
  ansible.builtin.command:
    argv:
      - "{{ python_uv_executable }}"
      - self
      - update
  environment:
    UV_NO_MODIFY_PATH: "1"
  register: python_uv_self_update
  changed_when: "'updated' in (python_uv_self_update.stdout ~ python_uv_self_update.stderr) | lower"
  notify: Notify updates of Python via Slack

- name: Verify uv executable
  when: python_uv_tools_by_os is defined
  ansible.builtin.command:
    argv:
      - "{{ python_uv_executable }}"
      - --version
  changed_when: false

- name: List installed uv tools
  when: python_uv_tools_by_os is defined
  ansible.builtin.command:
    argv:
      - "{{ python_uv_executable }}"
      - tool
      - list
  register: python_uv_tool_list
  changed_when: false

- name: Install Python command-line tools with uv
  when:
    - python_uv_tools_by_os is defined
    - (python_uv_tool_list.stdout_lines | select('match', '^' ~ item ~ ' ') | list | length) == 0
  ansible.builtin.command:
    argv:
      - "{{ python_uv_executable }}"
      - tool
      - install
      - "{{ item }}"
  loop: "{{ python_uv_selected_tools }}"
  changed_when: true
  notify: Notify updates of Python via Slack

- name: Upgrade Python command-line tools with uv
  when: python_uv_tools_by_os is defined
  ansible.builtin.command:
    argv:
      - "{{ python_uv_executable }}"
      - tool
      - upgrade
      - --all
  register: python_uv_tool_upgrade
  changed_when: "'Nothing to upgrade' not in (python_uv_tool_upgrade.stdout + python_uv_tool_upgrade.stderr)"
  notify: Notify updates of Python via Slack

- name: Add uv tools to PATH
  ansible.builtin.blockinfile:
    create: true
    dest: "{{ ansible_facts['env']['HOME'] }}/.zprofile"
    marker: "# {mark} ANSIBLE MANAGED BLOCK: Python tools"
    mode: "0644"
    state: present
    block: |
      export PATH="${PATH}:${HOME}/.local/bin"
  notify: Notify updates of Python via Slack
