---
- name: Check if uv is installed
  when: python_pip_packages is defined
  ansible.builtin.stat:
    path: "{{ ansible_facts['env']['HOME'] }}/.local/bin/uv"
  register: python_uv

- name: Install uv installer prerequisite on Fedora and CentOS
  when:
    - python_pip_packages is defined
    - not python_uv.stat.exists
    - ansible_facts['distribution'] in ['Fedora', 'CentOS']
  become: true
  ansible.builtin.package:
    name: curl
    state: present

- name: Install uv installer prerequisite on Ubuntu
  when:
    - python_pip_packages is defined
    - not python_uv.stat.exists
    - ansible_facts['distribution'] == 'Ubuntu'
  become: true
  ansible.builtin.apt:
    name: curl
    state: present
    update_cache: true

- name: Download the uv installer
  when:
    - python_pip_packages is defined
    - not python_uv.stat.exists
  ansible.builtin.get_url:
    url: https://astral.sh/uv/install.sh
    dest: /tmp/install.uv.sh
    mode: "0755"

- name: Install uv
  when:
    - python_pip_packages is defined
    - not python_uv.stat.exists
  ansible.builtin.command: /tmp/install.uv.sh
  environment:
    UV_INSTALL_DIR: "{{ ansible_facts['env']['HOME'] }}/.local/bin"
    UV_NO_MODIFY_PATH: "1"
  changed_when: true
  notify: Notify updates of Python via Slack

- name: Create the Python virtual environment with uv
  when: python_pip_packages is defined
  ansible.builtin.command:
    argv:
      - "{{ ansible_facts['env']['HOME'] }}/.local/bin/uv"
      - venv
      - "{{ ansible_facts['env']['HOME'] }}/.venv"
      - --python
      - "{{ ansible_facts['python']['executable'] }}"
    creates: "{{ ansible_facts['env']['HOME'] }}/.venv/bin/python"
  notify: Notify updates of Python via Slack

- name: Install and update Python packages with uv
  when: python_pip_packages is defined
  ansible.builtin.command:
    argv: "{{ [ansible_facts['env']['HOME'] + '/.local/bin/uv', 'pip', 'install', '--python', ansible_facts['env']['HOME'] + '/.venv/bin/python', '--upgrade'] + python_pip_packages }}"
  register: python_uv_pip_install
  changed_when: >-
    'Installed' in python_uv_pip_install.stderr or
    'Uninstalled' in python_uv_pip_install.stderr
  notify: Notify updates of Python via Slack

- name: Add uv and the Python virtual environment to PATH
  ansible.builtin.blockinfile:
    create: true
    dest: "{{ ansible_facts['env']['HOME'] }}/.zprofile"
    marker: "# {mark} ANSIBLE MANAGED BLOCK: Python virtual environment"
    mode: "0644"
    state: present
    block: |
      export PATH="${HOME}/.local/bin:${HOME}/.venv/bin:${PATH}"
  notify: Notify updates of Python via Slack
