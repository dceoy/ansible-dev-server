---
- name: Install Python packaging support on Fedora and CentOS
  when:
    - python_pip_packages is defined
    - ansible_facts['distribution'] in ['Fedora', 'CentOS']
  become: true
  ansible.builtin.package:
    name: python3-packaging
    state: present

- name: Install Python prerequisites on Ubuntu
  when:
    - python_pip_packages is defined
    - ansible_facts['distribution'] == 'Ubuntu'
  become: true
  ansible.builtin.apt:
    name:
      - python3-packaging
      - python3-venv
    state: present
    update_cache: true

- name: Install Python packaging support on macOS
  when:
    - python_pip_packages is defined
    - ansible_facts['distribution'] == 'MacOSX'
  community.general.homebrew:
    name: python-packaging
    state: present

- name: Install and update packages in a virtual environment
  when: python_pip_packages is defined
  ansible.builtin.pip:
    name: "{{ python_pip_packages }}"
    state: latest  # noqa: package-latest
    virtualenv: "{{ ansible_facts['env']['HOME'] }}/.venv"
    virtualenv_command: "{{ ansible_facts['python']['executable'] }} -m venv"
  notify: Notify updates of Python via Slack

- name: Add the Python virtual environment to PATH
  ansible.builtin.blockinfile:
    create: true
    dest: "{{ ansible_facts['env']['HOME'] }}/.zprofile"
    marker: "# {mark} ANSIBLE MANAGED BLOCK: Python virtual environment"
    mode: "0644"
    state: present
    block: |
      export PATH="${HOME}/.venv/bin:${PATH}"
  notify: Notify updates of Python via Slack
