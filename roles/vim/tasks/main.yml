---
- name: Put ~/.vimrc
  ansible.builtin.copy:
    src: vimrc
    dest: "{{ ansible_facts['env']['HOME'] }}/.vimrc"
  notify: Notify updates of Vim via Slack

- name: Check vim
  ansible.builtin.stat:
    path: "{{ ansible_facts['env']['HOME'] }}/.vim/bin/vim"
  register: vim_installed
  notify: Notify updates of Vim via Slack

- name: Create directories in ~/.vim/
  ansible.builtin.file:
    path: "{{ ansible_facts['env']['HOME'] }}/.vim/{{ item }}"
    state: directory
  loop:
    - src
    - bundles
  notify: Notify updates of Vim via Slack

- name: Download install-latest-vim installer
  ansible.builtin.get_url:
    url: https://raw.githubusercontent.com/dceoy/install-latest-vim/b010582d9fa61202ddeea7f0a5fa2d7e81bf0ebe/install_latest_vim.sh
    dest: "{{ ansible_facts['env']['HOME'] }}/.vim/src/install_latest_vim.sh"
    mode: "0755"
    force: true
  notify: Notify updates of Vim via Slack

- name: Install or update Vim and Vim plugins
  ansible.builtin.command:
    argv:
      - "{{ ansible_facts['env']['HOME'] }}/.vim/src/install_latest_vim.sh"
      - --lua
      - --vim-plug
  changed_when: true
  failed_when: false
  notify: Notify updates of Vim via Slack
