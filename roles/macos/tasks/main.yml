---
- name: Update macOS
  ansible.builtin.command:
    argv:
      - softwareupdate
      - --install
      - --all
      - --agree-to-license
      - --force
  changed_when: true
  failed_when: false

- name: Update homebrew and upgrade all packages
  become: false
  community.general.homebrew:
    update_homebrew: true
    upgrade_all: true

- name: Remove unwanted Homebrew formulae without installed dependents
  ansible.builtin.include_tasks: remove_unused_brew_formula.yml
  loop: "{{ macos_brew_packages_to_remove | default([]) }}"
  loop_control:
    loop_var: macos_brew_formula

- name: Install packages
  become: false
  when: macos_brew_packages is defined
  community.general.homebrew:
    name: "{{ macos_brew_packages }}"
    state: latest  # noqa: package-latest

- name: Install cask packages
  become: false
  when: macos_brew_cask_packages is defined
  community.general.homebrew_cask:
    name: "{{ item }}"
    state: latest  # noqa: package-latest
  failed_when: false
  loop: "{{ macos_brew_cask_packages }}"
