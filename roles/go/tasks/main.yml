---
- name: Set variables
  ansible.builtin.set_fact:
    go_path: "{{ ansible_facts['env']['PATH'] }}:/usr/local/bin"
    go_gopath: "{{ ansible_facts['env']['HOME'] }}/.go"

- name: Create .go
  ansible.builtin.file:
    path: "{{ go_gopath }}"
    state: directory
    mode: "0755"

- name: Install packages
  when: go_packages is defined
  environment:
    PATH: "{{ go_path }}"
    GOPATH: "{{ go_gopath }}"
  ansible.builtin.command:
    argv:
      - go
      - install
      - "{{ item }}@latest"
  loop: "{{ go_packages }}"
  changed_when: true
  failed_when: false
  notify: Notify updates of Go via Slack
