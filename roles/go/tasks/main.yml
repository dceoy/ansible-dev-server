---
- name: Set variables
  ansible.builtin.set_fact:
    go_path: "{{ ansible_facts['env']['PATH'] }}:/usr/local/bin"
    go_gopath: "{{ ansible_facts['env']['HOME'] }}/.go"

- name: Create .go
  ansible.builtin.file:
    path: "{{ go_gopath }}"
    state: directory
    mode: "0755"

- name: Set GOPATH and add its bin directory to PATH in zprofile
  ansible.builtin.blockinfile:
    create: true
    dest: "{{ ansible_facts['env']['HOME'] }}/.zprofile"
    marker: "# {mark} ANSIBLE MANAGED BLOCK: Go"
    mode: "0644"
    state: present
    block: |
      export GOPATH="{{ go_gopath }}"
      {% if ansible_facts['distribution'] in ['MacOSX', 'Fedora', 'CentOS'] or (ansible_facts['distribution'] == 'Ubuntu' and ansible_facts['distribution_version'] is version('26.04', '>=')) %}
      export PATH="${PATH}:${GOPATH}/bin"
      {% else %}
      export PATH="${GOPATH}/bin:${PATH}"
      {% endif %}
  notify: Notify updates of Go via Slack

- name: Install Go command-line tools
  when: go_cli_tools is defined
  environment:
    PATH: "{{ go_path }}"
    GOPATH: "{{ go_gopath }}"
  ansible.builtin.command:
    argv:
      - go
      - install
      - "{{ item }}@latest"
  loop: >-
    {{
      go_cli_tools
      + (go_cli_tools_non_macos | default([])
         if ansible_facts['distribution'] != 'MacOSX' else [])
      + (go_cli_tools_ubuntu_apt | default([])
         if ansible_facts['distribution'] != 'MacOSX'
         and (ansible_facts['distribution'] != 'Ubuntu'
           or ansible_facts['distribution_version'] is version('26.04', '<')) else [])
    }}
    | reject('in', system_managed_go_tools | default([])) | list
  changed_when: true
  failed_when: false
  notify: Notify updates of Go via Slack
