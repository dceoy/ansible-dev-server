---
- name: Set variables
  ansible.builtin.set_fact:
    go_path: "{{ ansible_facts['env']['PATH'] }}:/usr/local/bin"
    go_gopath: "{{ ansible_facts['env']['HOME'] }}/.go"

- name: Create .go
  ansible.builtin.file:
    path: "{{ go_gopath }}"
    state: directory
    mode: "0755"

- name: Set GOPATH and add its bin directory to PATH in zprofile
  ansible.builtin.blockinfile:
    create: true
    dest: "{{ ansible_facts['env']['HOME'] }}/.zprofile"
    marker: "# {mark} ANSIBLE MANAGED BLOCK: Go"
    mode: "0644"
    state: present
    block: |
      export GOPATH="{{ go_gopath }}"
      export PATH="${PATH}:${GOPATH}/bin"

- name: Find existing Go CLI tools
  when: go_cli_tools is defined
  environment:
    PATH: "{{ go_path }}:{{ go_gopath }}/bin"
  ansible.builtin.command:
    argv:
      - /bin/sh
      - -c
      - 'command -v "$1"'
      - sh
      - "{{ 'yq' if item == 'github.com/mikefarah/yq/v4' else item | basename }}"
  loop: "{{ go_cli_tools }}"
  register: go_cli_existing_binaries
  changed_when: false
  failed_when: false

- name: Install Go CLI tools not managed externally
  when:
    - go_cli_tools is defined
    - item.rc != 0 or item.stdout.startswith(go_gopath ~ '/bin/')
  environment:
    PATH: "{{ go_path }}:{{ go_gopath }}/bin"
    GOPATH: "{{ go_gopath }}"
  ansible.builtin.command:
    argv:
      - go
      - install
      - "{{ item.item }}@latest"
  loop: "{{ go_cli_existing_binaries.results }}"
  changed_when: true
  failed_when: false
